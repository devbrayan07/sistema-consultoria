<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Pagamentos | Sistema de Consultoria</title>

    <link
            rel="stylesheet"
            href="style.css"
    >

    <style>

        .pagamentos-page {
            padding: 28px;
        }

        .pagamentos-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .pagamentos-header h1 {
            margin: 0;
        }

        .pagamentos-header p {
            margin-top: 6px;
            opacity: .7;
        }

        .pagamentos-filtros {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .pagamentos-filtros select,
        .pagamentos-filtros input {
            min-height: 42px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid #d8dde6;
            background: #fff;
        }

        .pagamentos-resumo {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .pagamento-card-resumo {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #e8ebf0;
        }

        .pagamento-card-resumo span {
            display: block;
            font-size: 13px;
            opacity: .65;
            margin-bottom: 8px;
        }

        .pagamento-card-resumo strong {
            font-size: 24px;
        }

        .pagamentos-tabela-wrapper {
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e8ebf0;
        }

        .pagamentos-tabela {
            width: 100%;
            border-collapse: collapse;
        }

        .pagamentos-tabela th,
        .pagamentos-tabela td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf0f4;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }

        .pagamentos-tabela th {
            font-size: 13px;
            opacity: .7;
        }

        .status-pagamento {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pendente {
            background: #fff3cd;
            color: #856404;
        }

        .status-processando {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-pago {
            background: #d1fae5;
            color: #065f46;
        }

        .status-recusado,
        .status-cancelado,
        .status-expirado {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-estornado {
            background: #ede9fe;
            color: #5b21b6;
        }

        .acoes-pagamento {
            display: flex;
            gap: 8px;
        }

        .btn-pagamento {
            border: 0;
            border-radius: 8px;
            min-height: 34px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-visualizar {
            background: #e8f1ff;
            color: #0b5ed7;
        }

        .btn-aprovar-dev {
            background: #dcfce7;
            color: #166534;
        }

        .pagamentos-vazio {
            padding: 40px;
            text-align: center;
            opacity: .65;
        }

        .modal-pagamento-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-pagamento-backdrop.ativo {
            display: flex;
        }

        .modal-pagamento {
            width: min(560px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
        }

        .modal-pagamento-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .modal-pagamento-header h2 {
            margin: 0;
        }

        .modal-fechar {
            border: 0;
            background: transparent;
            font-size: 26px;
            cursor: pointer;
        }

        .pix-qr-container {
            display: flex;
            justify-content: center;
            margin: 24px 0;
        }

        .pix-qr-container img {
            max-width: 260px;
            width: 100%;
            border-radius: 12px;
        }

        .pix-codigo {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d8dde6;
            margin-top: 8px;
        }

        .pix-acoes {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .pix-detalhes {
            margin-top: 20px;
        }

        .pix-detalhes div {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f4;
        }

        @media (max-width: 900px) {

            .pagamentos-resumo {
                grid-template-columns:
                    repeat(2, minmax(150px, 1fr));
            }

        }

        @media (max-width: 600px) {

            .pagamentos-page {
                padding: 16px;
            }

            .pagamentos-header {
                flex-direction: column;
            }

            .pagamentos-resumo {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<div id="app-layout">

    <main class="pagamentos-page">

        <div class="pagamentos-header">

            <div>
                <h1>Pagamentos</h1>

                <p>
                    Consulte pagamentos, PIX e histórico financeiro.
                </p>
            </div>

        </div>


        <section class="pagamentos-resumo">

            <article class="pagamento-card-resumo">
                <span>Total de pagamentos</span>
                <strong id="resumo-total">0</strong>
            </article>

            <article class="pagamento-card-resumo">
                <span>Pendentes</span>
                <strong id="resumo-pendentes">0</strong>
            </article>

            <article class="pagamento-card-resumo">
                <span>Pagos</span>
                <strong id="resumo-pagos">0</strong>
            </article>

            <article class="pagamento-card-resumo">
                <span>Valor recebido</span>
                <strong id="resumo-valor-pago">
                    R$ 0,00
                </strong>
            </article>

        </section>


        <section class="pagamentos-filtros">

            <select id="filtro-status">

                <option value="">
                    Todos os status
                </option>

                <option value="PENDENTE">
                    Pendente
                </option>

                <option value="PROCESSANDO">
                    Processando
                </option>

                <option value="PAGO">
                    Pago
                </option>

                <option value="RECUSADO">
                    Recusado
                </option>

                <option value="CANCELADO">
                    Cancelado
                </option>

                <option value="EXPIRADO">
                    Expirado
                </option>

                <option value="ESTORNADO">
                    Estornado
                </option>

            </select>


            <input
                    id="filtro-busca"
                    type="search"
                    placeholder="Buscar empresa ou usuário..."
            >

        </section>


        <section class="pagamentos-tabela-wrapper">

            <table class="pagamentos-tabela">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Empresa</th>
                    <th>Usuário</th>
                    <th>Obrigação</th>
                    <th>Valor</th>
                    <th>Método</th>
                    <th>Status</th>
                    <th>Criado em</th>
                    <th>Pago em</th>
                    <th>Ações</th>
                </tr>

                </thead>

                <tbody id="pagamentos-body">
                </tbody>

            </table>


            <div
                    id="pagamentos-vazio"
                    class="pagamentos-vazio"
                    hidden
            >
                Nenhum pagamento encontrado.
            </div>

        </section>

    </main>

</div>


<div
        id="modal-pagamento-backdrop"
        class="modal-pagamento-backdrop"
>

    <div class="modal-pagamento">

        <div class="modal-pagamento-header">

            <h2>
                Detalhes do pagamento
            </h2>

            <button
                    id="btn-fechar-modal"
                    class="modal-fechar"
                    type="button"
            >
                &times;
            </button>

        </div>


        <div
                id="pix-qr-container"
                class="pix-qr-container"
        >
        </div>


        <div id="pix-codigo-container">

            <label for="pix-codigo">
                PIX copia e cola
            </label>

            <textarea
                    id="pix-codigo"
                    class="pix-codigo"
                    readonly
            ></textarea>

            <div class="pix-acoes">

                <button
                        id="btn-copiar-pix"
                        class="btn-pagamento btn-visualizar"
                        type="button"
                >
                    Copiar PIX
                </button>

            </div>

        </div>


        <div
                id="pix-detalhes"
                class="pix-detalhes"
        >
        </div>

    </div>

</div>


<script src="auth.js"></script>
<script src="api.js"></script>
<script src="layout.js"></script>
<script src="pagamentos.js"></script>

</body>

</html>
