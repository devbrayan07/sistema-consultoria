spring.application.name=sistema-consultoria

# =========================================================
# BANCO DE DADOS
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_consultoria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Railway fornece PORT automaticamente.
# Localmente continua usando 8082.
server.port=${PORT:8082}

# =========================================================
# MERCADO PAGO
# =========================================================

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}

mercadopago.sandbox=${MERCADOPAGO_SANDBOX:true}

mercadopago.sandbox.email=${MERCADOPAGO_SANDBOX_EMAIL:test_user_br@testuser.com}
mercadopago.sandbox.nome=${MERCADOPAGO_SANDBOX_NOME:APRO}
mercadopago.sandbox.valor=${MERCADOPAGO_SANDBOX_VALOR:50.00}

mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET}

# =========================================================
# PROFILE
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# =========================
# EMAIL
# =========================

spring.mail.host=smtpout.secureserver.net
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtpout.secureserver.net

app.mail.from=${MAIL_USERNAME}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8082}